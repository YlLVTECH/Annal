<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>笔记本</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- 自定义标题栏（无系统边框：整条可拖拽，双击最大化） -->
      <header id="titlebar" data-tauri-drag-region>
        <div class="titlebar-left">
          <svg class="titlebar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>
          <span class="titlebar-title">笔记本</span>
        </div>
        <div class="titlebar-actions">
          <button id="open-file-btn" class="titlebar-btn" title="打开 Markdown 文件 (Ctrl+O)" aria-label="打开文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </button>
          <button id="theme-toggle" class="titlebar-btn" title="切换明暗主题" aria-label="切换主题">
            <span class="titlebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
          </button>
        </div>
        <div class="titlebar-controls">
          <button id="win-min" class="win-btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button id="win-max" class="win-btn" title="最大化" aria-label="最大化">
            <svg class="icon-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="5" y="5" width="14" height="14"/></svg>
            <svg class="icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="5" y="8" width="11" height="11"/><path d="M8 8V5h11v11h-3"/></svg>
          </button>
          <button id="win-close" class="win-btn win-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>

      <!-- 左侧：笔记列表 -->
      <div id="workspace">
      <aside id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-actions">
            <button id="sidebar-collapse" class="icon-btn" title="收起侧栏 (Ctrl+\)" aria-label="收起侧栏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button id="new-note-btn" title="新建笔记 (Ctrl+N)" aria-label="新建笔记">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
          </div>
        </div>
        <div class="sidebar-search">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5" />
              <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <input id="search-input" type="search" placeholder="搜索笔记…" spellcheck="false" />
          </div>
        </div>
        <ul id="note-list"></ul>
        <div id="empty-hint" hidden>
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          <p>还没有笔记</p>
          <p>点击「＋」新建一篇</p>
        </div>
      </aside>

      <!-- 侧栏宽度拖拽条 -->
      <div id="sidebar-resizer" title="拖拽调整侧栏宽度，双击恢复默认"></div>

      <!-- 右侧：编辑器 -->
      <main id="editor-pane">
        <button id="sidebar-expand" title="展开侧栏 (Ctrl+\)" aria-label="展开侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div id="editor-header" hidden>
          <span id="editor-title"></span>
          <span id="editor-missing" hidden>文件已删除</span>
          <span id="saved-status"></span>
          <button id="commit-note-btn" title="把当前内容提交为一个新版本">提交</button>
          <button id="save-as-note-btn" title="把当前外部文件复制另存为一篇笔记" hidden>存为笔记</button>
          <button id="delete-note-btn" title="删除这篇笔记">删除</button>
        </div>

        <!-- 工具栏：Markdown 排版 + 视图切换 -->
        <div id="toolbar" hidden>
          <div class="toolbar-group">
            <button class="tool-btn" data-cmd="h1" title="一级标题">H1</button>
            <button class="tool-btn" data-cmd="h2" title="二级标题">H2</button>
            <button class="tool-btn" data-cmd="h3" title="三级标题">H3</button>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-cmd="bold" title="粗体 (Ctrl+B)"><b>B</b></button>
            <button class="tool-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
            <button class="tool-btn" data-cmd="strike" title="删除线"><s>S</s></button>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-cmd="quote" title="引用">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4"/><path d="M20 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4"/></svg>
            </button>
            <button class="tool-btn" data-cmd="code" title="行内代码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
            </button>
            <button class="tool-btn" data-cmd="codeblock" title="代码块">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 9.5 2 2.5-2 2.5"/><path d="m14 9.5 2 2.5-2 2.5"/><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
            </button>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-cmd="ul" title="无序列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
            </button>
            <button class="tool-btn" data-cmd="ol" title="有序列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12h11"/><path d="M10 18h11"/><path d="M10 6h11"/><path d="M4 10h2"/><path d="M4 6h1v4"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
            </button>
            <button class="tool-btn" data-cmd="task" title="任务列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </button>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-cmd="link" title="链接 (Ctrl+K)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button class="tool-btn" data-cmd="image" title="插入图片">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
            <button class="tool-btn" data-cmd="table" title="插入表格">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
            </button>
            <button class="tool-btn" data-cmd="hr" title="分割线">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
          </div>
          <div class="toolbar-spacer"></div>
          <div class="toolbar-group" id="view-toggle" title="视图模式">
            <button class="view-btn active" data-mode="edit" title="编辑 (Ctrl+E)">编辑</button>
            <button class="view-btn" data-mode="split" title="分屏 (Ctrl+Shift+E)">分屏</button>
            <button class="view-btn" data-mode="preview" title="预览 (Ctrl+Shift+P)">预览</button>
          </div>
        </div>

        <!-- 智能表格插入弹层（锚定在表格按钮下方） -->
        <div id="table-popover" hidden role="dialog" aria-label="插入表格">
          <div id="tp-smart" hidden>
            <div class="tp-smart-title">识别到选区数据</div>
            <div class="tp-smart-desc" id="tp-smart-desc"></div>
            <button class="tp-smart-btn" id="tp-smart-apply">转换为表格</button>
          </div>
          <div class="tp-grid" id="tp-grid" role="grid" tabindex="0" aria-label="选择表格行列数，方向键调整，回车插入"></div>
          <div class="tp-size" id="tp-size">3 行 × 4 列</div>
          <div class="tp-footer">
            <label class="tp-check" title="第一行作为表头（加粗）">
              <input type="checkbox" id="tp-header" checked />
              <span>首行为表头</span>
            </label>
            <div class="tp-align" role="group" aria-label="列对齐方式">
              <button type="button" class="tp-align-btn active" data-align="left" title="左对齐">左</button>
              <button type="button" class="tp-align-btn" data-align="center" title="居中">中</button>
              <button type="button" class="tp-align-btn" data-align="right" title="右对齐">右</button>
            </div>
          </div>
        </div>

        <div id="editor-body" class="mode-edit" hidden>
          <textarea id="editor" placeholder="开始输入…" spellcheck="false"></textarea>
          <div id="preview" class="markdown-body"></div>
        </div>
        <div id="editor-empty">
          <svg class="empty-art" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <p class="empty-title">选择左侧一篇笔记，或点击「＋」新建</p>
          <p class="empty-sub">也可以将 Markdown 文件拖入窗口直接打开</p>
        </div>
        <div id="statusbar" hidden>
          <button id="focus-toggle" title="专注模式 (Ctrl+Shift+F)">专注</button>
          <span id="word-count"></span>
        </div>
      </main>
      </div>
    </div>

    <!-- 专注模式退出按钮 -->
    <button id="focus-exit" hidden>退出专注 · Esc</button>

    <!-- 笔记列表右键菜单 -->
    <div id="context-menu" hidden></div>

    <!-- 历史版本弹层 -->
    <div id="history-overlay" hidden>
      <div class="history-box" role="dialog" aria-modal="true" aria-labelledby="history-title">
        <div class="history-header">
          <div class="history-heading">
            <p class="history-title" id="history-title">历史版本</p>
            <p class="history-sub" id="history-sub"></p>
          </div>
          <button id="history-close" class="history-close" title="关闭 (Esc)" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="history-body">
          <ul class="history-list" id="history-list"></ul>
          <div class="history-view">
            <div class="history-view-head">
              <div class="history-view-meta" id="history-view-meta"></div>
              <div class="history-view-actions">
                <button id="history-compare-btn" class="history-compare" hidden title="把选中的版本与对比源逐行对比">对比</button>
                <button id="history-restore-btn" class="history-restore" hidden title="把笔记内容恢复为这个版本（当前内容将被覆盖）">恢复此版本</button>
              </div>
            </div>
            <div class="history-compare-bar" id="history-compare-bar" hidden>
              <span class="history-compare-label">对比源</span>
              <select id="history-compare-src" class="history-compare-src" title="选择对比的基准版本"></select>
              <span class="history-compare-hint">默认最新版本 · 选中左侧版本查看与源的逐行差异</span>
            </div>
            <div class="history-view-content markdown-body" id="history-view-content"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 提交新版本弹层 -->
    <div id="commit-overlay" hidden>
      <div class="commit-box" role="alertdialog" aria-modal="true" aria-labelledby="commit-title">
        <p class="commit-title" id="commit-title">提交新版本</p>
        <p class="commit-text" id="commit-text"></p>
        <input id="commit-input" class="commit-input" type="text" placeholder="提交说明（可留空），例如：完成初稿" maxlength="200" spellcheck="false" />
        <div class="commit-actions">
          <button id="commit-cancel" class="btn-secondary">取消</button>
          <button id="commit-ok" class="btn-primary">提交</button>
        </div>
      </div>
    </div>

    <!-- 删除确认弹层 -->
    <div id="confirm-overlay" hidden>
      <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <svg class="confirm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        <p class="confirm-title" id="confirm-title">删除这篇笔记？</p>
        <p class="confirm-text" id="confirm-text">删除后将无法恢复，请确认后再操作。</p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="btn-secondary">取消</button>
          <button id="confirm-ok" class="btn-danger">删除</button>
        </div>
      </div>
    </div>
  </body>
</html>
